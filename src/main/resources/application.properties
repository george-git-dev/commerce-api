spring.application.name=commerce-api
server.port=8081

# Segredos locais (não versionado; copie de .env.example). Em produção: variáveis de ambiente / SSM.
spring.config.import=optional:file:.env[.properties]

# Perfil padrão na sua máquina: dev (dados de teste). Em produção: SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Postgres (em dev, o do docker-compose.yml desta pasta). Usuário próprio, só o schema commerce_api (A7).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/commerce}
spring.datasource.username=${DB_USERNAME:commerce_api}
spring.datasource.password=${DB_PASSWORD:}

# O banco só muda por migração do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas: diferença = a API nem sobe.
spring.flyway.default-schema=commerce_api
spring.jpa.properties.hibernate.default_schema=commerce_api
spring.jpa.hibernate.ddl-auto=validate
# Coleções (variantes, fotos, notas…) carregadas em lote: evita o N+1 na vitrine.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Login: token do Keycloak (realm da Nani). O emissor e o endereço PÚBLICO (o que vem no
# "iss" do token); as chaves vêm pelo endereço INTERNO (em produção, a rede do Docker).
commerce.auth.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/auth/realms/nani}
commerce.auth.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/nani/protocol/openid-connect/certs}

# Mensagens padrão de validação (@NotBlank, @Email…) sempre em português, venha o pedido de onde vier.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
