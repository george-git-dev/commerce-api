spring.datasource.url=jdbc:h2:file:./data/commerce-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Necessario para o data.sql rodar DEPOIS do Hibernate criar as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console web em http://localhost:8080/h2-console
# JDBC URL pra colar la: jdbc:h2:file:./data/commerce-db
spring.h2.console.enabled=true
