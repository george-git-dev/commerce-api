components:
  schemas:
    CreatePromotionRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        discountType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_VALUE
        discountValue:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    PromotionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        discountType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_VALUE
        discountValue:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    CreateProductAttributeRequest:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
        stock:
          type: integer
          format: int32
        active:
          type: boolean
        categoryId:
          type: integer
          format: int64
        brandId:
          type: integer
          format: int64
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CreateProductAttributeRequest"
      required:
      - active
      - brandId
      - categoryId
      - description
      - name
      - price
      - stock
    ProductAttributeResponse:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
          format: int32
        active:
          type: boolean
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
