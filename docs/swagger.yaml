openapi: 3.1.0
info:
  title: Commerce API
  description: "Domínio das lojas: catálogo, sacola, pedidos, pagamentos, afiliados\
    \ e relatórios. Chamada pelo BFF de cada loja com o token do Keycloak. Erros no\
    \ formato ProblemDetail: status, code e detail em português."
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Local
security:
- bearerAuth: []
tags:
- name: Administração - Inventário
  description: Estoque e indicadores de inventário.
- name: Área do Cliente - Endereços
  description: Endereços cadastrados pelo usuário autenticado.
- name: Área do Cliente - Carrinho
  description: Carrinho de compras do usuário autenticado.
- name: Administração - Relatórios de Vendas
  description: Indicadores e métricas de vendas.
- name: Público - Catálogo
  description: "Consulta de produtos, categorias, marcas e promoções."
- name: Administração - Afiliados
  description: Operações administrativas relacionadas a afiliados.
- name: Administração - Relatórios de Clientes
  description: Indicadores e estatísticas de clientes.
- name: Administração - Relatórios Financeiros
  description: Indicadores financeiros consolidados.
- name: Administração - Financeiro
  description: Resumo financeiro e indicadores.
- name: Área do Cliente - Minha Conta
  description: Dados da conta na loja.
- name: Administração - Pedidos
  description: Consulta e gerenciamento administrativo de pedidos.
- name: Administração - Usuários
  description: Consulta de usuários da loja.
- name: Administração - Despesas
  description: Cadastro e manutenção de despesas.
- name: Administração - Relatórios de Afiliados
  description: Rankings e estatísticas de afiliados.
- name: Administração - Pagamentos
  description: Aprovação e rejeição de pagamentos.
- name: Área do Cliente - Afiliado
  description: "Área do afiliado autenticado, vendas e comissões."
- name: Administração - Catálogo
  description: "Cadastro, atualização e exclusão de produtos, categorias, marcas e\
    \ promoções."
- name: Área do Cliente - Pedidos
  description: Pedidos realizados pelo usuário autenticado e checkout.
- name: Administração - Venda Manual
  description: Registro de vendas realizadas manualmente.
paths:
  /promotions/{id}:
    get:
      tags:
      - Público - Catálogo
      summary: Consultar promoção
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "401":
          description: Sem token ou token inválido
        "403":
          description: Sem permissão (code ACCESS_DENIED)
        "500":
          description: Erro inesperado (code INTERNAL_ERROR)
        "503":
          description: Banco indisponível (code SERVICE_UNAVAILABLE)
    put:
      tags:
      - Administração - Catálogo
      summary: Atualizar promoção
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "401":
          description: Sem token ou token inválido
        "403":
          description: Sem permissão (code ACCESS_DENIED)
        "500":
          description: Erro inesperado (code INTERNAL_ERROR)
        "503":
          description: Banco indisponível (code SERVICE_UNAVAILABLE)
    delete:
      tags:
      - Administração - Catálogo
      summary: Excluir promoção
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "401":
          description: Sem token ou token inválido
        "403":
          description: Sem permissão (code ACCESS_DENIED)
        "500":
          description: Erro inesperado (code INTERNAL_ERROR)
        "503":
          description: Banco indisponível (code SERVICE_UNAVAILABLE)
